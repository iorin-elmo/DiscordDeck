name: Windowsのセッション保持テスト

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: 実際のElectronで保存・終了・再起動を確認
        run: npm run test:e2e -- --grep "セッションCookie・LocalStorage・IndexedDB|終了ハンドラー|カラムの外寸"
      - name: 失敗時のテスト画面を表示
        if: failure()
        shell: pwsh
        run: Get-ChildItem -LiteralPath test-results -Recurse -Filter error-context.md | ForEach-Object { Get-Content -LiteralPath $_.FullName }
